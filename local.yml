services:
  django:
    container_name: python_boilerplate_local_django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: python_boilerplate_local_django
    restart: unless-stopped
    platform: linux/x86_64
    depends_on:
      - mysql
      - mailhog
    volumes:
      - .:/app:z
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: /start
    networks:
      - python_boilerplate_app
  mysql:
    container_name: python_boilerplate_local_mysql
    image: 'mysql:8.0'
    restart: unless-stopped
    ports:
      - '${DB_PORT:-3306}:${DB_PORT:-3306}'
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
      - MYSQL_DATABASE=${DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASS}
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
    volumes:
      - "mysql:/var/lib/mysql"
    networks:
      - python_boilerplate_app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p${DB_PASS}"]
  mailhog:
    container_name: python_boilerplate_local_mailhog
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - '${FORWARD_MAILHOG_PORT:-1025}:1025'
      - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
    networks:
      - python_boilerplate_app

networks:
  python_boilerplate_app:
    driver: bridge

volumes:
  mysql:
    driver: local
