services:
  django:
    container_name: python_boilerplate_local_django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: python_boilerplate_local_django
    restart: unless-stopped
    platform: linux/x86_64
    depends_on:
      - mariadb
      - mailhog
    volumes:
      - .:/app:z
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: /start
    networks:
      - python_boilerplate_app

  mariadb:
    container_name: python_boilerplate_local_mariadb
    image: 'mariadb:10.7'
    restart: unless-stopped
    ports:
      - '${MARIADB_PORT:-3306}:${MARIADB_PORT:-3306}'
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-secret}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-python_boilerplate}
    volumes:
      - 'localmariadb:/var/lib/mysql'
    networks:
      - python_boilerplate_app

  mailhog:
    container_name: python_boilerplate_local_mailhog
    image: mailhog/mailhog
    restart: unless-stopped
    ports:
      - '${FORWARD_MAILHOG_PORT:-1025}:1025'
      - '${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025'
    networks:
      - python_boilerplate_app

networks:
  python_boilerplate_app:
    driver: bridge

volumes:
  localmariadb:
    driver: local
